name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      # Packages typecheck against each other's built types, so build first.
      - name: Build
        run: npm run build

      - name: Format
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # Fails when coverage drops below the thresholds in vitest.config.ts.
      - name: Coverage
        run: npm run coverage

      # Fails on high and critical only. One moderate is accepted and tracked:
      # mxgraph's setTooltips XSS, reached through bpmn-visualization, has no
      # upstream fix and the viewer does not call it. See SECURITY.md.
      - name: Audit
        run: npm audit --audit-level=high
